name: UI Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-ui:
    name: Lint UI
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Run deterministic UI lint
        run: npm run lint:ui:ci
