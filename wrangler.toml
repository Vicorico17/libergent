name = "libergent"
main = "src/worker.js"
compatibility_date = "2026-03-13"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./ui/out"
binding = "ASSETS"

[browser]
binding = "BROWSER"

[triggers]
crons = ["* * * * *"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false

[vars]
IMAGE_SEARCH_LIMITS_ENABLED = "1"
GROQ_VISION_MODEL = "qwen/qwen3.8-27b"
SEARCH_CREDITS_ENABLED = "1"
LIBERGENT_PUBLIC_URL = "https://libergent.com"
STRIPE_WEEKLY_PRICE_ID = "price_1UaLYFBGLerz2o1wCLZHFcMB"
STRIPE_CREDITS_10_PRICE_ID = "price_1UaLYbBGLerz2o1wTxYpkrbI"
STRIPE_CREDITS_30_PRICE_ID = "price_1UaLYuBGLerz2o1wEtrxEkim"
FREE_JEV_ENABLED = "1"
FREE_JEV_MODEL = "jev-latest"
OPENCLAW_BRIDGE_URL = "https://bridge.srv1648069.hstgr.cloud"
PREMIUM_JEV_ENABLED = "1"
PREMIUM_JEV_MODEL = "jev-latest"
LIBERGENT_INTEGRATIONS_ENABLED = "1"
LIBERGENT_AGENT_MCP_ENABLED = "1"
LIBERGENT_FREE_SEARCH_LIMITS_ENABLED = "1"

# Approximate per-location burst protection; not a worldwide spending cap.
[[ratelimits]]
name = "FREE_SEARCH_CLIENT_LIMITER"
namespace_id = "1101"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "FREE_SEARCH_TOTAL_LIMITER"
namespace_id = "1102"
simple = { limit = 300, period = 60 }

# Photo recognition burst limits for the Groq free tier (per Cloudflare location).
[[ratelimits]]
name = "IMAGE_SEARCH_CLIENT_LIMITER"
namespace_id = "1103"
simple = { limit = 2, period = 60 }

[[ratelimits]]
name = "IMAGE_SEARCH_TOTAL_LIMITER"
namespace_id = "1104"
simple = { limit = 3, period = 60 }

# Persistent integration cache and quota counters.
[[durable_objects.bindings]]
name = "INTEGRATION_GATEWAY"
class_name = "IntegrationGateway"

[[migrations]]
tag = "integration-gateway-v1"
new_sqlite_classes = ["IntegrationGateway"]

# Shared marketplace traffic budgets across production Worker isolates.
[[durable_objects.bindings]]
name = "SCRAPE_COORDINATOR"
class_name = "ScrapeCoordinator"

[[migrations]]
tag = "scrape-coordinator-v1"
new_sqlite_classes = ["ScrapeCoordinator"]

# Dedicated owner trial endpoint. It exposes only /mcp and keeps public
# Premium/account actions disabled. Do not copy these settings to production.
[env.mcp-test]
name = "libergent-mcp-test"
workers_dev = true

[env.mcp-test.vars]
FREE_JEV_ENABLED = "0"
LIBERGENT_MCP_ENABLED = "1"
LIBERGENT_MCP_TEST_MODE = "1"
PREMIUM_JEV_ENABLED = "0"
OPENCLAW_BRIDGE_URL = "https://bridge.srv1648069.hstgr.cloud"
PREMIUM_JEV_MODEL = "jev-latest"

[env.mcp-test.triggers]
crons = []

[[env.mcp-test.ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 40, period = 60 }

[[env.mcp-test.ratelimits]]
name = "MCP_SEARCH_LIMITER"
namespace_id = "1002"
simple = { limit = 8, period = 60 }

[env.mcp-test.observability]
enabled = true
head_sampling_rate = 1
