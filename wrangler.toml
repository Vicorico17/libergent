name = "libergent"
main = "src/worker.js"
compatibility_date = "2026-03-13"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./ui/out"
binding = "ASSETS"

[browser]
binding = "BROWSER"

[triggers]
crons = ["* * * * *"]

[vars]
OPENCLAW_BRIDGE_URL = "https://bridge.srv1648069.hstgr.cloud"
PREMIUM_JEV_ENABLED = "1"
PREMIUM_JEV_MODEL = "jev-latest"
LIBERGENT_INTEGRATIONS_ENABLED = "1"
LIBERGENT_AGENT_MCP_ENABLED = "1"

# Persistent integration cache and quota counters.
[[durable_objects.bindings]]
name = "INTEGRATION_GATEWAY"
class_name = "IntegrationGateway"

[[migrations]]
tag = "integration-gateway-v1"
new_sqlite_classes = ["IntegrationGateway"]
